<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat App</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        #messages {
            border: 1px solid #ccc;
            height: 300px;
            overflow-y: auto;
            padding: 10px;
            margin: 20px 0;
            background-color: #f9f9f9;
        }
        #messages p {
            margin: 5px 0;
            padding: 5px;
            background-color: white;
            border-radius: 3px;
        }
        #message {
            width: 70%;
            padding: 10px;
            margin-right: 10px;
        }
        #sendBtn {
            padding: 10px 20px;
        }
    </style>
</head>
<body>
    <h1>Welcome to Chat App</h1>
    <input type="text" id="message" placeholder="Enter Message"/>
    <button id="sendBtn">Send Message</button>
    <div id="messages">
        <p style="color: #888; font-style: italic;">Messages will appear here...</p>
    </div>
    <script src="/socket.io/socket.io.js"></script>
    <script>
    document.addEventListener("DOMContentLoaded", function() {
     const socket = io();    // Initialize socket connection
     const sendBtn = document.getElementById("sendBtn");
     const messageInput = document.getElementById("message");
     const allMessages = document.getElementById("messages");
     
     // Listen for incoming messages
     socket.on("message", (message) => {
            console.log("Received message:", message);
            console.log("allMessages element:", allMessages);
            const p = document.createElement("p");
            p.innerText = message;
            p.style.border = "1px solid red"; // Debug styling
            console.log("Created paragraph:", p);
            allMessages.appendChild(p);
            console.log("Message appended to DOM");
     });

     // Send message when button is clicked
     sendBtn.addEventListener("click", (e) => {
           const msg = messageInput.value.trim();
           if (msg) {
               console.log("Sending message:", msg);
               socket.emit("sendMessage", msg);
               messageInput.value = "";
           }
       });

     // Send message when Enter key is pressed
     messageInput.addEventListener("keypress", (e) => {
         if (e.key === "Enter") {
             const msg = messageInput.value.trim();
             if (msg) {
                 console.log("Sending message:", msg);
                 socket.emit("sendMessage", msg);
                 messageInput.value = "";
             }
         }
     });

     // Connection status
     socket.on("connect", () => {
         console.log("Connected to server");
         // Send a test message to verify connection
         setTimeout(() => {
             console.log("Sending test message");
             socket.emit("sendMessage", "Test message - connection established!");
         }, 1000);
     });

     socket.on("disconnect", () => {
         console.log("Disconnected from server");
    })});
     </script>
</body>
</html>
